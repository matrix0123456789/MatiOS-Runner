[package]
name = "MatiOsRunner"
version = "0.1.0"
edition = "2021"

[dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32", "Win32_System",
    "Win32_System_Memory", "Win32_System_Kernel",
    "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader",

    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Services",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",] }
once_cell = "1.21.4"
os-version = "0.2.1"
console = "0.16.4"
uuid = { version = "1.24.0", features = ["v4"] }

[[bin]]
target = "x86_64-pc-windows-gnu"
name = "MatiOsRunner"
opt-level = 0