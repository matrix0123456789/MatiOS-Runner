name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup
      run:
         sudo apt-get install gcc-mingw-w64-x86-64 -y
    - run:
        rustup target add x86_64-pc-windows-gnu
    - run:
        rustup target add x86_64-unknown-linux-gnu
    - name: Build windows
      run: cargo build --release --package MatiOsRunner --bin MatiOsRunner --target x86_64-pc-windows-gnu
    - name: Make result directory
      run: mkdir result
    - name: Copy windows
      run: cp target/x86_64-pc-windows-gnu/release/MatiOsRunner.exe result/MatiOsRunner.exe
    - name: Build linux
      run: cargo build --release --package MatiOsRunner --bin MatiOsRunner --target x86_64-unknown-linux-gnu
    - name: Copy linux
      run: cp target/x86_64-unknown-linux-gnu/release/MatiOsRunner result/MatiOsRunner
    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: matiosshell
        path: result
